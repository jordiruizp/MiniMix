name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --strict

  core-linux:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors

  test:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [Packages/Core, Packages/Render, Packages/Media, Packages/Audio,
                  Packages/Output, Packages/Persistence, App, Tests, Tools/StressHarness]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: swift --version
      - run: scripts/swift-test.sh ${{ matrix.package }}

  bundle:
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: scripts/bundle-app.sh release
