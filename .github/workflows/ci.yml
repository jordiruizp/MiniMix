name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors

  macos:
    # Un solo job macOS (lint + todos los paquetes + bundle) para minimizar minutos.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: swift --version
      - run: brew install swiftlint
      - run: scripts/ci.sh
      - run: scripts/bundle-app.sh release
      - run: scripts/smoke-app.sh 10
